name: Package main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-main-${{ github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            bundles: msi,nsis
            artifacts: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*-setup.exe
          - platform: macos-arm64
            runner: macos-15
            bundles: dmg
            artifacts: target/release/bundle/dmg/*.dmg
          - platform: linux-x64
            runner: ubuntu-22.04
            bundles: deb,appimage
            artifacts: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libnm-dev patchelf pkg-config xdg-utils

      - uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/host-build-cache
        with:
          target: ${{ matrix.platform }}-main-package

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build installers without publishing updater artifacts
        shell: bash
        env:
          BUNDLES: ${{ matrix.bundles }}
        run: |
          set -euo pipefail
          npx tauri build --ci --bundles "$BUNDLES" --config src-tauri/tauri.ci.conf.json

      - name: Upload installable preview
        uses: actions/upload-artifact@v4
        with:
          name: codex-tools-${{ matrix.platform }}-${{ github.run_number }}
          path: ${{ matrix.artifacts }}
          retention-days: 14
          if-no-files-found: error
